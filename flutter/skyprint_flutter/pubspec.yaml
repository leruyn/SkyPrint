name: skyprint_flutter
description: >
  Cầu nối Dart -> skyprint-core (Kotlin) qua MethodChannel. Android-only cho
  tới nay (bọc skyprint-core, nằm trong repo skyprint/flutter/).
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.9.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.dcorp.skyprint_flutter
        pluginClass: SkyprintFlutterPlugin
