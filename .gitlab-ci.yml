image: eclipse-temurin:17-jdk

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

stages:
  - test
  - deploy

check:
  stage: test
  script:
    - cd kmp && ./gradlew check

publish-sdk:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - cd kmp && ./gradlew :skyprint-core:publish :skyprint-template:publish
